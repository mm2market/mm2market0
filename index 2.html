<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mm2 market</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1e1b3a;--line:#dcd9f5;--gold:#f5b400;--bg:#fff;--soft:#f6f5ff;--ok:#16a34a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:13px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;line-height:1.5}
.wrap{max-width:520px;margin:0 auto;padding:14px 12px 40px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
h1{margin:0;font-size:1.7rem;font-weight:800;cursor:pointer}
.cartbtn{position:relative;width:42px;height:42px;border:1px solid var(--line);background:#fff;border-radius:12px;font-size:1.3rem;cursor:pointer}
.badge{position:absolute;top:-6px;left:-6px;min-width:18px;height:18px;border-radius:9px;background:var(--gold);color:var(--ink);font-size:.75rem;font-weight:800;display:none;align-items:center;justify-content:center;padding:0 4px}
.note{border:1px solid var(--line);border-right:5px solid var(--gold);border-radius:12px;padding:10px 12px;font-weight:700;font-size:.95rem;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.card{border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden;display:flex;flex-direction:column;cursor:pointer}
.card .pic{height:118px;display:flex;align-items:center;justify-content:center;padding:6px}
.card img{max-width:100%;max-height:100%;object-fit:contain}
.card .info{padding:0 10px}
.name{font-weight:700;font-size:1rem;margin:2px 0}
.price{font-weight:800;font-size:1.15rem}
.buy{margin:8px 10px 10px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px;font:inherit;font-weight:700;color:var(--ink);cursor:pointer}
.buy:active{background:var(--soft)}
.ph{font-size:3.4rem;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:var(--soft);border-radius:10px}
.back{border:0;background:none;font:inherit;font-weight:700;color:var(--ink);cursor:pointer;padding:4px 0;margin-bottom:6px}
.big{border:1px solid var(--line);border-radius:14px;height:240px;display:flex;align-items:center;justify-content:center;padding:10px}
.big img{max-width:100%;max-height:100%;object-fit:contain}
.big .ph{font-size:6rem}
.title{font-size:1.4rem;font-weight:800;margin:12px 0 2px}
.bigprice{font-size:1.5rem;font-weight:800}
.qty{display:flex;align-items:center;gap:12px;margin:12px 0}
.qty button,.mini button{width:34px;height:34px;border:1px solid var(--line);background:#fff;border-radius:10px;font:inherit;font-size:1.2rem;font-weight:800;cursor:pointer}
.qty span{min-width:26px;text-align:center;font-weight:800;font-size:1.2rem}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:12px;font:inherit;font-weight:800;font-size:1.05rem;cursor:pointer;margin-top:8px}
.btn.alt{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.btn.main{background:var(--gold);color:var(--ink)}
.row{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:8px;margin-bottom:8px}
.row .t{width:54px;height:54px;flex:none;display:flex;align-items:center;justify-content:center}
.row .t img{max-width:100%;max-height:100%}
.row .t .ph{font-size:1.8rem}
.row .m{flex:1;min-width:0}
.mini{display:flex;align-items:center;gap:8px;margin-top:4px}
.mini button{width:28px;height:28px;font-size:1rem}
.mini span{font-weight:800;min-width:18px;text-align:center}
.del{border:0;background:none;font-size:1.2rem;cursor:pointer}
.total{display:flex;justify-content:space-between;font-weight:800;font-size:1.2rem;margin:12px 2px}
.methods{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.methods button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px 6px;font:inherit;font-weight:800;cursor:pointer;color:var(--ink)}
.methods button.on{border-color:var(--gold);background:#fff9e6}
.box{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--soft);font-weight:700}
.num{font-size:1.4rem;font-weight:800;direction:ltr;text-align:center;margin:6px 0}
a.link{color:var(--ink);font-weight:800;word-break:break-all}
.empty{text-align:center;padding:40px 0;font-weight:700}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:20px;font-weight:700;display:none;z-index:9}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="logo">mm2 market</h1>
    <button class="cartbtn" id="cartbtn" aria-label="السلة">🛒<span class="badge" id="badge">0</span></button>
  </header>
  <main id="app"></main>
</div>
<div class="toast" id="toast"></div>

var byId={};ITEMS.forEach(function(i){byId[i[0]]=i;});
var cart={};try{cart=JSON.parse(localStorage.getItem('mm2cart')||'{}')||{};}catch(e){cart={};}
var buyNow=null,method=null;
function save(){try{localStorage.setItem('mm2cart',JSON.stringify(cart));}catch(e){}}
function fmt(n){return Number(n).toLocaleString('en-US')+' جنيه';}
function pic(i){return i[3]>=0?'<img src="'+IMGS[i[3]]+'" alt="'+i[1]+'">':'<div class="ph">🗡️</div>';}
function count(){var c=0;for(var k in cart)c+=cart[k];return c;}
function badge(){var b=document.getElementById('badge'),c=count();b.textContent=c;b.style.display=c?'flex':'none';}
function toast(t){var e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(function(){e.style.display='none';},1400);}
function go(h){location.hash=h;}
var app=document.getElementById('app');

function home(){
  var h='<div class="note">مش متاح بيع قولديات، دي هي الأسعار. أحياناً بيكون فيه عروض خاصة للعملاء الجدد. شكراً لتعاملكم معنا 🙏</div><div class="grid">';
  ITEMS.forEach(function(i){
    h+='<div class="card" onclick="go(\'#/p/'+i[0]+'\')"><div class="pic">'+pic(i)+'</div><div class="info"><div class="name">'+i[1]+'</div><div class="price">'+fmt(i[2])+'</div></div><button class="buy">اشتري</button></div>';
  });
  app.innerHTML=h+'</div>';
}
var q=1;
function product(id){
  var i=byId[id];if(!i){go('#/');return;}
  app.innerHTML='<button class="back" onclick="go(\'#/\')">← رجوع</button><div class="big">'+pic(i)+'</div><div class="title">'+i[1]+'</div><div class="bigprice">'+fmt(i[2])+'</div>'+
  '<div class="qty"><button onclick="chq(-1)">−</button><span id="q">'+q+'</span><button onclick="chq(1)">+</button></div>'+
  '<button class="btn alt" onclick="addCart('+id+')">🛒 أضف للسلة</button>'+
  '<button class="btn main" onclick="buyThis('+id+')">اشتري الآن</button>';
}
function chq(d){q=Math.max(1,q+d);document.getElementById('q').textContent=q;}
function addCart(id){cart[id]=(cart[id]||0)+q;save();badge();toast('اتضاف للسلة ✓');}
function buyThis(id){buyNow=[[id,q]];method=null;go('#/pay');}
function cartView(){
  var ids=Object.keys(cart).filter(function(k){return cart[k]>0&&byId[k];});
  if(!ids.length){app.innerHTML='<button class="back" onclick="go(\'#/\')">← رجوع</button><div class="empty">السلة فاضية 🛒</div>';return;}
  var h='<button class="back" onclick="go(\'#/\')">← رجوع</button>',t=0;
  ids.forEach(function(k){var i=byId[k],n=cart[k];t+=i[2]*n;
    h+='<div class="row"><div class="t">'+pic(i)+'</div><div class="m"><div class="name">'+i[1]+'</div><div class="price">'+fmt(i[2])+'</div><div class="mini"><button onclick="cq('+k+',-1)">−</button><span>'+n+'</span><button onclick="cq('+k+',1)">+</button></div></div><button class="del" onclick="cq('+k+',-999)">🗑️</button></div>';});
  h+='<div class="total"><span>الإجمالي</span><span>'+fmt(t)+'</span></div><button class="btn main" onclick="buyCart()">إتمام الشراء</button>';
  app.innerHTML=h;
}
function cq(id,d){cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];save();badge();cartView();}
function buyCart(){buyNow=null;method=null;go('#/pay');}
function pay(){
  var lines=buyNow||Object.keys(cart).filter(function(k){return byId[k];}).map(function(k){return [Number(k),cart[k]];});
  if(!lines.length){go('#/');return;}
  var t=0,s='';
  lines.forEach(function(l){var i=byId[l[0]];t+=i[2]*l[1];s+='<div style="display:flex;justify-content:space-between"><span>'+i[1]+' × '+l[1]+'</span><span>'+fmt(i[2]*l[1])+'</span></div>';});
  var h='<button class="back" onclick="history.back()">← رجوع</button><div class="box">'+s+'<div class="total" style="margin:8px 0 0"><span>الإجمالي</span><span>'+fmt(t)+'</span></div></div>';
  h+='<div class="title" style="font-size:1.1rem">اختار طريقة الدفع</div><div class="methods">';
  ['We Cash','Orange Cash','Vodafone Cash','InstaPay'].forEach(function(m){h+='<button class="'+(method===m?'on':'')+'" onclick="pick(\''+m+'\')">'+m+'</button>';});
  h+='</div>';
  if(method==='InstaPay'){
    h+='<div class="box">للدفع بـ InstaPay كلمنا على صفحة التيك توك:<div class="num" style="font-size:1.1rem"><a class="link" href="'+TIKTOK+'" target="_blank" rel="noopener">@roblox_mm2x2</a></div><a class="btn main" style="text-align:center;text-decoration:none" href="'+TIKTOK+'" target="_blank" rel="noopener">افتح صفحة التيك توك</a></div>';
  }else if(method){
    h+='<div class="box">حوّل '+fmt(t)+' على '+method+' للرقم:<div class="num">'+PHONE+'</div><button class="btn alt" onclick="copyNum()">نسخ الرقم</button></div><div class="box" style="margin-top:8px">بعد التحويل ابعت صورة التحويل على التيك توك: <a class="link" href="'+TIKTOK+'" target="_blank" rel="noopener">@roblox_mm2x2</a></div>';
  }
  app.innerHTML=h;
}
function pick(m){method=m;pay();}
function copyNum(){try{navigator.clipboard.writeText(PHONE).then(function(){toast('اتنسخ الرقم ✓');});}catch(e){toast(PHONE);}}
function route(){
  var h=location.hash||'#/';window.scrollTo(0,0);
  var m=h.match(/^#\/p\/(\d+)/);
  if(m){q=1;product(Number(m[1]));}
  else if(h==='#/cart')cartView();
  else if(h==='#/pay')pay();
  else home();
  badge();
}
document.getElementById('cartbtn').onclick=function(){go('#/cart');};
document.getElementById('logo').onclick=function(){go('#/');};
window.addEventListener('hashchange',route);
route();
</script>
</body>
</html>
